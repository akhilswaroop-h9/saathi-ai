);\n    box-shadow: 0 8px 24px rgba(30, 60, 100, 0.15);\n}\n\ndiv[data-testid=\"stVerticalBlockBorderWrapper\"] {\n    border-radius: 16px;\n}\n\n.stButton > button {\n    border-radius: 10px;\n    font-weight: 600;\n    transition: all 0.2s ease;\n}\n\n.stButton > button:hover {\n    transform: translateY(-1px);\n}\n\n[data-testid=\"stDataFrame\"] {\n    border-radius: 12px;\n    overflow: hidden;\n}\n\nhr {\n    margin-top: 1.5rem;\n    margin-bottom: 1.5rem;\n}\n/* ===== SAATHI AI  CONSISTENCY ===== */\n\n/* Theme-aware main content */\n.stApp {\n    color: var(--text-color);\n}\n\n/* Theme-aware cards */\n[data-testid=\"stMetric\"],\n[data-testid=\"stExpander\"],\n[data-testid=\"stDataFrame\"],\n[data-testid=\"stTable\"] {\n    border-radius: 14px;\n}\n\n/* Form controls */\n.stTextInput input,\n.stNumberInput input,\n.stTextArea textarea {\n    border-radius: 10px;\n}\n\n/* Buttons */\n.stButton > button,\n.stDownloadButton > button {\n    border-radius: 10px;\n    font-weight: 600;\n    transition: all 0.2s ease;\n}\n\n/* Cleaner section headings */\nh1, h2, h3 {\n    letter-spacing: -0.3px;\n}\n\n/* Improve page spacing */\n.block-container {\n    padding-top: 2rem;\n    padding-bottom: 2rem;\n}\n\n/* Smooth  transitions */\n.stApp,\n[data-testid=\"stSidebar\"],\n[data-testid=\"stMetric\"] {\n    transition: background-color 0.2s ease,\n                color 0.2s ease,\n                border-color 0.2s ease;\n}\n/* ===== SAATHI AI SIDEBAR NAVIGATION ===== */\n\n/* Sidebar layout */\n[data-testid=\"stSidebar\"] {\n    border-right: 1px solid var(--secondary-background-color);\n}\n\n[data-testid=\"stSidebar\"] > div:first-child {\n    padding-top: 1.5rem;\n}\n\n/* Navigation labels */\n[data-testid=\"stSidebar\"] label {\n    font-weight: 500;\n}\n\n/* Sidebar radio buttons */\n[data-testid=\"stSidebar\"] [role=\"radiogroup\"] {\n    gap: 8px;\n}\n\n/* Individual navigation options */\n[data-testid=\"stSidebar\"] [role=\"radiogroup\"] label {\n    border-radiu "\"\", unsafe_allow_html=True)\n\n# ---------------- DATA INTEGRATION ----------------\n\n# ---------------- DATA INTEGRATION ----------------\n\nfrom data_engine import (\n    load_student_data,\n    calculate_success_score,\n    identify_risks,\n    generate_student_insights,\n    segment_student,\n)\n\n# Load the original CSV datasets\nstudents = load_student_data()\n\n# Calculate scores and risks using original column names\nstudents = calculate_success_score(students)\nstudents = identify_risks(students)\n\n# Create student segments\nstudents[\"Student Segment\"] = students.apply(\n    segment_student,\n    axis=1\n)\n\n# Rename columns only AFTER all calculations are complete\nstudents = students.rename(columns={\n    \"student_id\": \"Student ID\",\n    \"name\": \"Name\",\n    \"department\": \"Department\",\n    \"year\": \"Year\",\n    \"cgpa\": \"CGPA\",\n    \"attendance_percentage\": \"Attendance\",\n    \"backlogs\": \"Backlogs\",\n    \"placement_readiness\": \"Placement Readiness\",\n    \"success_score\": \"Success Score\",\n    \"academic_risk\": \"Academic Risk\",\n    \"placement_risk\": \"Placement Risk\",\n})\n# ---------------- SIDEBAR ----------------\n\nst.sidebar.markdown(\"# 🎓 SAATHI AI\")\nst.sidebar.caption(\"STUDENT SUCCESS INTELLIGENCE\")\n\n\nst.sidebar.divider()\n\npage = st.sidebar.radio(\n    \"NAVIGATION\",\n    [\n        \"Overview\",\n        \"Student Analytics\",\n        \"At-Risk Students\",\n        \"Placement Readiness\",\n        \"Student Intelligence\",\n        \"Data Import\",\n        \"Student Search\",\n        \"Faculty Intervention\",\n        \"Student Success Plan\",\n        \"Faculty Progress Tracking\",\n        \"AI Student Insights\",\n    ]\n)\n\nst.sidebar.divider()\nst.sidebar.caption(\"Hackathon Prototype | 2026\")\n\n# ---------------- SUCCESS SCORE ----------------\n\nstudents[\"Academic Score\"] = (\n    students[\"CGPA\"] / 10 * 100\n)\n\nstudents[\"Success Score\"] = (\n    students[\"Academic Score\"] * 0.30\n    + students[\"Attendance\"] * 0.20\n    + students[\"Placement Readiness\"] * 0.30\n    + (100 - students[\"Backlogs\"] * 20).clip(0, 100) * 0.20\n).round(1)\n\nstudents[\"Academic Risk\"] = students.apply(\n    lambda row: \"High\" if (\n        row[\"Attendance\"] \u003c 65\n        or row[\"Backlogs\"] >= 3\n        or row[\"CGPA\"] \u003c 6\n    ) else \"Medium\" if (\n        row[\"Attendance\"] \u003c 75\n        or row[\"Backlogs\"] >= 2\n        or row[\"CGPA\"] \u003c 7\n    ) else \"Low\",\n    axis=1\n)\n\nstudents[\"Placement Risk\"] = students[\n    \"Placement Readiness\"\n].apply(\n    lambda score: \"High\" if score \u003c 40\n    else \"Medium\" if score \u003c 65\n    else \"Low\"\n)\n\n# ---------------- HEADER ----------------\n\nst.markdown(\"\"\"\n\u003cdiv class=\"hero\">\n    \u003ch1>SAATHI AI\u003c/h1>\n    \u003cp>Student Success Intelligence Platform\u003c/p>\n    \u003cp>Predict challenges. Discover potential. Improve student success.\u003c/p>\n\u003c/div>\n\"\"\", unsafe_allow_html=True)\n\n# ---------------- OVERVIEW PAGE ----------------\n\nif page == \"Overview\":\n\n    st.subheader(\"Campus Intelligence Overview\")\n\n    department = st.selectbox(\n        \"Select Department\",\n        [\"All Departments\"] + sorted(\n            students[\"Department\"].unique().tolist()\n        )\n    )\n\n    filtered = students.copy()\n\n    if department != \"All Departments\":\n        filtered = filtered[\n            filtered[\"Department\"] == department\n        ]\n\n    total_students = len(filtered)\n\n    high_risk = len(\n        filtered[filtered[\"Academic Risk\"] == \"High\"]\n    )\n\n    avg_score = (\n        filtered[\"Success Score\"].mean()\n        if total_students else 0\n    )\n\n    avg_attendance = (\n        filtered[\"Attendance\"].mean()\n        if total_students else 0\n    )\n\n    c1, c2, c3, c4 = st.columns(4)\n\n    c1.metric(\"Total Students\", total_students)\n\n    c2.metric(\n        \"Average Success Score\",\n        f\"{avg_score:.1f}/100\"\n    )\n\n    c3.metric(\n        \"High Academic Risk\",\n        high_risk\n    )\n\n    c4.metric(\n        \"Average Attendance\",\n        f\"{avg_attendance:.1f}%\"\n    )\n\n    st.divider()\n\n    left, right = st.columns(2)\n\n    with left:\n        st.subheader(\"Student Success Distribution\")\n\n        fig = px.histogram(\n            filtered,\n            x=\"Success Score\",\n            nbins=8,\n            title=\"Success Score Distribution\",\n            color_discrete_sequence=[\"#276EF1\"]\n        )\n\n        fig.update_layout(\n            plot_bgcolor=\"white\",\n            paper_bgcolor=\"white\"\n        )\n\n        st.plotly_chart(fig, use_container_width=True)\n\n    with right:\n        st.subheader(\"Academic Risk Distribution\")\n\n        risk_counts = (\n            filtered[\"Academic Risk\"]\n            .value_counts()\n            .rename_axis(\"Risk Level\")\n            .reset_index(name=\"Students\")\n        )\n\n        fig = px.pie(\n            risk_counts,\n            names=\"Risk Level\",\n            values=\"Students\",\n            hole=0.55,\n            title=\"Academic Risk Overview\"\n        )\n\n        fig.update_layout(\n            paper_bgcolor=\"white\"\n        )\n\n        st.plotly_chart(fig, use_container_width=True)\n\n    st.subheader(\"Student Performance Overview\")\n\n    st.dataframe(\n        filtered[\n            [\n                \"Student ID\",\n                \"Department\",\n                \"CGPA\",\n                \"Attendance\",\n                \"Backlogs\",\n                \"Success Score\",\n                \"Academic Risk\",\n                \"Placement Risk\"\n            ]\n        ],\n        use_container_width=True,\n        hide_index=True\n    )\n\n# ---------------- STUDENT ANALYTICS ----------------\n\nelif page == \"Student Analytics\":\n\n    st.subheader(\"📊 Student Analytics\")\n\n    selected_id = st.selectbox(\n        \"Select Student\",\n        students[\"Student ID\"].tolist()\n    )\n\n    student = students[\n        students[\"Student ID\"] == selected_id\n    ].iloc[0]\n\n    c1, c2, c3 = st.columns(3)\n\n    c1.metric(\"CGPA\", f\"{student['CGPA']:.2f}/10\")\n    c2.metric(\"Attendance\", f\"{student['Attendance']}%\")\n    c3.metric(\"Success Score\", f\"{student['Success Score']}/100\")\n\n    st.write(\"### Performance Indicators\")\n\n    indicators = pd.DataFrame({\n        \"Indicator\": [\n            \"Academic Performance\",\n            \"Attendance\",\n            \"Placement Readiness\"\n        ],\n        \"Score\": [\n            student[\"Academic Score\"],\n            student[\"Attendance\"],\n            student[\"Placement Readiness\"]\n        ]\n    })\n\n    fig = px.bar(\n        indicators,\n        x=\"Indicator\",\n        y=\"Score\",\n        range_y=[0, 100],\n        text=\"Score\",\n        title=f\"Performance Profile: {selected_id}\"\n    )\n\n    st.plotly_chart(fig, use_container_width=True)\n\n    st.write(\"### Recommended Interventions\")\n\n    if student[\"Attendance\"] \u003c 75:\n        st.warning(\n            \"Attendance support: arrange faculty follow-up.\"\n        )\n\n    if student[\"Backlogs\"] > 0:\n        st.info(\n            f\"Academic support: review {student['Backlogs']} backlog(s).\"\n        )\n\n    if student[\"Placement Readiness\"] \u003c 65:\n        st.info(\n            \"Placement support: recommend aptitude, coding, \"\n            \"and mock interview practice.\"\n        )\n\n    if (\n        student[\"Attendance\"] >= 75\n        and student[\"Backlogs\"] == 0\n        and student[\"Placement Readiness\"] >= 65\n    ):\n        st.success(\n            \"Continue regular monitoring and skill development.\"\n        )\n\n# ---------------- AT-RISK STUDENTS ----------------\n\nelif page == \"At-Risk Students\":\n\n    st.subheader(\"🚨 Students Requiring Attention\")\n\n    risk GPA\",\n                \"Placement Readiness\",\n                \"Placement Risk\"\n            ]\n        ],\n        use_container_width=True,\n        hide_index=True\n    )\n\n    st.caption(\n        \"This prototype uses sample data. Placement predictions \"\n        \"are not validated forecasts.\"\n    )\n    # ---------------- STUDENT INTELLIGENCE ----------------\n\nelif page == \"Student Intelligence\":\n\n    st.subheader(\"🧠 Explainable Student Intelligence\")\n\n    selected_id = st.selectbox(\n        \"Choose a student\",\n        students[\"Student ID\"].tolist(),\n        key=\"intelligence_student\"\n    )\n\n    student = students[\n        students[\"Student ID\"] == selected_id\n    ].iloc[0]\n\n    insights_data = generate_student_insights(student)\n\n    col1, col2, col3 = st.columns(3)\n\n    col1.metric(\n        \"Success Score\",\n        f\"{student['Success Score']}/100\"\n    )\n\n    col2.metric(\n        \"Academic Risk\",\n        student[\"Academic Risk\"]\n    )\n\n    col3.metric(\n        \"Placement Risk\",\n        student[\"Placement Risk\"]\n    )\n\n    st.divider()\n\n    st.markdown(\"### 🎯 Student Segment\")\n\n    st.info(student[\"Student Segment\"])\n\n    st.markdown(\"### 🔍 Why does this student need attention?\")\n\n    for insight in insights_data[\"insights\"]:\n        st.warning(insight)\n\n    st.markdown(\"### 💡 Recommended Actions\")\n\n    for recommendation in insights_data[\"recommendations\"]:\n        st.success(recommendation)\n\n    st.markdown(\"### 📊 Student Performance Indicators\")\n\n    indicators = pd.DataFrame({\n        \"Indicator\": [\n            \"Academic Performance\",\n            \"Attendance\",\n            \"Placement Readiness\",\n            \"LMS Activity\",\n            \"Technical Skills\",\n            \"Soft Skills\",\n        ],\n        \"Score\": [\n            student[\"academic_score\"],\n            student[\"Attendance\"],\n            student[\"Placement Readiness\"  student table\n    if \"student_id\" not in students.columns:\n        raise ValueError(\n            \"students.csv must contain a student_id column.\"\n        )\n\n    if students[\"student_id\"].isna().any():\n        raise ValueError(\n            \"students.csv contains missing student IDs.\"\n        )\n\n    if students[\"student_id\"].duplicated().any():\n        raise ValueError(\n            \"students.csv contains duplicate student IDs.\"\n        )\n\n    combined = students.copy()\n\n    for filename in datasets:\n        data = load_csv(filename)\n\n        if \"student_id\" not in data.columns:\n            raise ValueError(\n                f\"{filename} must contain a student_id column.\"\n            )\n\n        if data[\"student_id\"].isna().any():\n            raise ValueError(\n                f\"{filename} contains missing student IDs.\"\n            )\n\n        if data[\"student_id\"].duplicated().any():\n            raise ValueError(\n                f\"{filename} contains duplicate student IDs. \"\n                \"Aggregate repeated records before merging.\"\n            )\n\n        combined = combined.merge(\n            data,\n            on=\"student_id\",\n            how=\"left\",\n            validate=\"one_to_one\",\n            indicator=f\"_merge_{filename.replace('.csv', '')}\"\n        )\n\n        # Show data coverage without silently hiding missing data\n        unmatched = combined[\n            combined[f\"_merge_{filename.replace('.csv', '')}\"]\n            == \"left_only\"\n        ][\"student_id\"].tolist()\n\n        combined = combined.drop(\n            columns=[\n                f\"_merge_{filename.replace('.csv', '')}\"\n            ]\n        )\n\n        if unmatched:\n            print(\n                f\"Warning: {filename} has no matching record \"\n                f\"for student IDs: {unmatched}\"\n            )\n\n    return combined\n\n\ndef calculate_success_score(data):\n    \"\"\"Calculate a provisional student Success Score.\"\"\"\n\n    result = data.copy()\n\n    # Normalize column names in case they were renamed in app.py.\n    aliases = {\n        \"CGPA\": \"cgpa\",\n        \"Attendance\": \"attendance_percentage\",\n        \"Placement Readiness\": \"placement_readiness\",\n        \"Backlogs\": \"backlogs\",\n    }\n\n    result = result.rename(columns=aliases)\n\n    required_columns = [\n        \"cgpa\",\n        \"attendance_percentage\",\n        \"placement_readiness\",\n        \"backlogs\",\n    ]\n\n    missing_columns = [\n        column\n        for column in required_columns\n        if column not in result.columns\n    ]\n\n    if missing_columns:\n        raise ValueError(\n            f\"Missing required columns: {missing_columns}. \"\n            f\"Available columns: {list(result.columns)}\"\n        )\n\n    result[\"academic_score\"] = (\n        result[\"cgpa\"].clip(0, 10) * 10\n    )\n\n    result[\"backlog_score\"] = (\n        100 - result[\"backlogs\"].clip(lower=0) * 20\n    ).clip(0, 100)\n\n    result[\"success_score\"] = (\n        result[\"academic_score\"] * 0.30\n        + result[\"attendance_percentage\"].clip(0, 100) * 0.20\n        + result[\"placement_readiness\"].clip(0, 100) * 0.30\n        + result[\"backlog_score\"] * 0.20\n    ).round(1)\n\n    return result\n\n\ndef identify_risks(data):\n    \"\"\"Identify academic and placement risks transparently.\"\"\"\n\n    result = data.copy()\n\n    result[\"academic_risk\"] = \"Low\"\n\n    high_academic_risk = (\n        (result[\"attendance_percentage\"] \u003c 65)\n        | (result[\"cgpa\"] \u003c 6)\n        | (result[\"backlogs\"] >= 3)\n    )\n\n    medium_academic_risk = (\n        (result[\"attendance_percentage\"] \u003c 75)\n        | (result[\"cgpa\"] \u003c 7)\n        | (result[\"backlogs\"] >= 2)\n    )\n\n    result.loc[\n        medium_academic_risk,\n        \"academic_risk\"\n    ] = \"Medium\"\n\n    result.loc[\n        high_academic_risk,\n        \"academic_risk\"\n    ] = \"High\"\n\n    result[\"placement_risk\"] = \"Low\"\n\n    result.loc[\n        result[\"placement_readiness\"] \u003c 65,\n        \"placement_risk\"\n    ] = \"Medium\"\n\n    result.loc[\n        result[\"placement_readiness\"] \u003c 40,\n        \"placement_risk\"\n    ] = \"High\"\n\n    return result\ndef generate_student_insights(student):\n    \"\"\"Explain student risks and recommend interventions.\"\"\"\n\n    insights = []\n    recommendations = []\n\n    # Academic performance\n    if student[\"CGPA\"] \u003c 6:\n        insights.append(\n            \"Low CGPA is a major academic concern.\"\n        )\n        recommendations.append(\n            \"Arrange subject-wise remedial classes.\"\n        )\n\n    # Attendance\n    if student[\"Attendance\"] \u003c 75:\n        insights.append(\n            \"Attendance is below the 75% monitoring threshold.\"\n        )\n        recommendations.append(\n            \"Arrange faculty follow-up and an attendance improvement plan.\"\n        )\n\n    # Backlogs\n    if student[\"Backlogs\"] >= 2:\n        insights.append(\n            f\"The student has {student['Backlogs']} backlogs.\"\n        )\n        recommendations.append(\n            \"Create a backlog recovery plan with weekly assessments.\"\n        )\n\n    # Placement readiness\n    if student[\"Placement Readiness\"] \u003c 65:\n        insights.append(\n            \"Placement readiness needs improvement.\"\n        )\n        recommendations.append(\n            \"Provide aptitude practice, coding exercises, and mock interviews.\"\n        )\n\n    # LMS activity\n    lms_score = student.get(\"lms_activity_score\", None)\n\n    if pd.notna(lms_score) and lms_score \u003c 50:\n        insights.append(\n            \"Learning platform activity is low.\"\n        )\n        recommendations.append(\n            \"Encourage regular LMS usage and assignment completion.\"\n        )\n\n    if not insights:\n        insights.append(\n            \"No major concerns were identified by the current rules.\"\n        )\n\n    if not recommendations:\n        recommendations.append(\n            \"Continue monitoring progress and provide development opportunities.\"\n        )\n\n    return {\n        \"insights\": insights,\n        \"recommendations\": recommendations,\n    }\ndef segment_student(student):\n    \"\"\"\n    Assign a student to an interpretable segment.\n    \"\"\"\n\n    if (\n        student[\"academic_risk\"] == \"High\"\n        and student[\"placement_risk\"] == \"High\"\n    ):\n        return \"Comprehensive Support Needed\"\n\n    if (\n        student[\"academic_risk\"] == \"High\"\n        or student[\"academic_risk\"] == \"Medium\"\n    ):\n        return \"Academic Support Needed\"\n\n    if student[\"placement_risk\"] in [\"High\", \"Medium\"]:\n        return \"Placement Preparation Needed\"\n\n    return \"High Performing\"", "intervention_tracker.py": "import json\nimport os\nimport pandas as pd\n\nDATA_FILE = \"interventions.json\"\n\nCOLUMNS = [\n    \"student_id\",\n    \"student_name\",\n    \"faculty_name\",\n    \"intervention_type\",\n    \"notes\",\n    \"status\",\n    \"created_at\",\n]\n\n\ndef load_interventions():\n    \"\"\"Load all saved faculty intervention records.\"\"\"\n    if not os.path.exists(DATA_FILE):\n        return []\n\n    try:\n        with open(DATA_FILE, \"r\", encoding=\"utf-8\") as file:\n            data = json.load(file)\n            return data if isinstance(data, list) else []\n    except (json.JSONDecodeError, OSError):\n        return []\n\n\ndef add_intervention(\n    student_id,\n    student_name=\"\",\n    faculty_name=\"\",\n    intervention_type=\"General\",\n    notes=\"\",\n    status=\"Pending\",\n    **kwargs,\n):\n    \"\"\"Add a new faculty intervention.\"\"\"\n    from datetime import datetime\n\n    record = {\n        \"student_id\": str(student_id),\n        \"student_name\": student_name,\n        \"fa
